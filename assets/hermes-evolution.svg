  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.48" stop-color="#10152b"/>
      <stop offset="1" stop-color="#070912"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#18213a"/>
      <stop offset="0.5" stop-color="#00ffff" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0.74"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00ffff" stop-opacity="0.76"/>
      <stop offset="0.52" stop-color="#7cf7ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#00ffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ffff" stop-opacity="0"/>
      <stop offset="0.50" stop-color="#00ffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="panelClip">
      <rect x="28" y="26" width="1144" height="468" rx="24"/>
    </clipPath>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardGlow" x="-18%" y="-18%" width="136%" height="136%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 0 H6" stroke="rgba(255,255,255,0.045)"/>
    </pattern>
    <style>
      text { font-family: 'Geist Mono', 'SFMono-Regular', Consolas, monospace; letter-spacing: .35px; }
      .orb-pulse { animation: orbPulse 7.5s ease-in-out infinite; transform-origin: 1058px 78px; }
      .scan-beam { animation: scanDrift 9s ease-in-out infinite; }
      .pulse-dot { animation: pulseDot 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .signal-dot { animation: signalPing 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .node-pulse { animation: nodePulse 4.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .bar-pulse { animation: barGlow 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
      .timeline-trace { stroke-dasharray: 540; stroke-dashoffset: 540; animation: traceDraw 8s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 18 12; animation: dashFlow 12s linear infinite; }
      @keyframes orbPulse { 0%,100% { transform: scale(1); opacity:.72; } 50% { transform: scale(1.035); opacity:.92; } }
      @keyframes scanDrift { 0% { transform: translateY(-125px); opacity:0; } 18% { opacity:.70; } 62% { opacity:.42; } 100% { transform: translateY(560px); opacity:0; } }
      @keyframes pulseDot { 0%,100% { transform: scale(1); opacity:.56; } 50% { transform: scale(1.34); opacity:.95; } }
      @keyframes signalPing { 0%,100% { transform: scale(1); opacity:.58; } 45% { transform: scale(1.42); opacity:.95; } }
      @keyframes nodePulse { 0%,100% { transform: scale(1); opacity:.50; } 50% { transform: scale(1.48); opacity:.88; } }
      @keyframes barGlow { 0%,100% { opacity:.72; } 50% { opacity:1; } }
      @keyframes traceDraw { 0% { stroke-dashoffset:540; opacity:.28; } 35%,70% { stroke-dashoffset:0; opacity:.9; } 100% { stroke-dashoffset:-120; opacity:.32; } }
      @keyframes dashFlow { to { stroke-dashoffset:-120; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
